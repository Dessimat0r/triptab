<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#635bff">
    <title data-ui="Reconnect to TripTab">Reconnect to TripTab</title>
    <style>
      :root { color-scheme: light; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #f7f7fc; color: #21213c; }
      main { width: min(100%, 560px); padding: 36px 28px; background: #fff; border: 1px solid #e8e7f1; border-radius: 24px; box-shadow: 0 12px 48px #21213c0a; }
      .mark { width: 64px; height: 64px; background: #635bff; color: #fff; border-radius: 18px; display: grid; place-items: center; font-size: 36px; font-weight: 800; margin-bottom: 24px; }
      h1 { margin: 0 0 12px; font-size: 25px; letter-spacing: -0.6px; }
      p { color: #64637a; line-height: 1.65; margin: 0 0 24px; }
      a { display: inline-flex; justify-content: center; align-items: center; min-height: 48px; width: 100%; padding: 12px 20px; border-radius: 12px; background: #635bff; color: #fff; font-weight: 650; text-decoration: none; }
      a:focus-visible { outline: 3px solid #ada8ff; outline-offset: 4px; }
      label { display: grid; gap: 6px; margin: 12px 0; font-weight: 600; }
      input, select, button { width: 100%; min-height: 44px; border: 1px solid #c6c6d4; border-radius: 8px; padding: 10px; font: inherit; color: #21213c; background: #fff; }
      fieldset { margin: 14px 0; border: 1px solid #c6c6d4; border-radius: 8px; }
      #capture-people label { display: flex; gap: 8px; align-items: center; font-weight: 400; }
      #capture-people input { width: 20px; min-height: 20px; }
      button { background: #4355db; color: white; border: 0; font-weight: 600; cursor: pointer; margin: 16px 0; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">T</div>
      <h1 data-ui="You’re offline">You’re offline</h1>
      <p data-ui="Capture a new expense here if you enabled offline capture while connected. It will sync when you open TripTab online.">Capture a new expense here if you enabled offline capture while connected. It will sync when you open TripTab online.</p>
      <p id="capture-status" role="status" data-ui="Loading this device’s capture settings…">Loading this device’s capture settings…</p>
      <form id="offline-expense" hidden>
        <label><span data-ui="Holiday">Holiday</span><select id="capture-trip"></select></label>
        <label><span data-ui="Expense name">Expense name</span><input id="capture-title" required maxlength="200" autocomplete="off"></label>
        <label><span data-ui="Amount">Amount</span><input id="capture-amount" required inputmode="decimal" placeholder="0.00"></label>
        <label><span data-ui="Currency">Currency</span><select id="capture-currency"></select></label>
        <label><span data-ui="Date">Date</span><input id="capture-date" type="date" required></label>
        <label><span data-ui="Paid by">Paid by</span><select id="capture-payer"></select></label>
        <fieldset><legend data-ui="Shared by">Shared by</legend><div id="capture-people"></div></fieldset>
        <label id="capture-rate-field" hidden><span><span data-ui="Manual rate: one unit in">Manual rate: one unit in</span> <span id="rate-currency"></span></span><input id="capture-rate" inputmode="decimal" placeholder="1.00"></label>
        <p id="capture-converted" role="status"></p><label id="capture-rate-confirm" hidden><input type="checkbox" id="capture-rate-checked"><span data-ui="I checked the manual rate and converted amount.">I checked the manual rate and converted amount.</span></label>
        <p id="capture-shared" hidden data-ui="The shared receipt photo will be attached.">The shared receipt photo will be attached.</p>
        <label><span data-ui="Receipt photo (optional)">Receipt photo (optional)</span><input id="capture-photo" type="file" accept="image/jpeg,image/png,image/webp"></label>
        <button type="submit" data-ui="Save on this device">Save on this device</button>
      </form>
      <a href="/" data-ui="Try again">Try again</a>
    </main>
    <script src="/offline-language.js"></script><script src="/offline-store.js"></script><script src="/offline-capture.js"></script>
  </body>
</html>
