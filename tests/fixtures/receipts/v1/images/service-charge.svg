<svg xmlns="http://www.w3.org/2000/svg" width="640" height="270" viewBox="0 0 640 270">
<title>Service charge added once, mapped as tip/service adjustment</title>
<defs><filter id="obscured"><feGaussianBlur stdDeviation="2.5"/></filter></defs>
<rect width="640" height="270" fill="#fff"/>
<g fill="#111" font-family="monospace" font-size="22">
<text x="25" y="35" font-size="16">SYNTHETIC TEST RECEIPT — NOT A SALE</text>
<text x="25" y="65" font-size="16">Corpus v1: service-charge</text>
<text x="25" y="115">Dinner                  20.00</text>
<text x="25" y="145">SUBTOTAL EUR            20.00</text>
<text x="25" y="175">SERVICE CHARGE 10%       2.00</text>
<text x="25" y="205">TOTAL EUR               22.00</text>
</g>

</svg>
