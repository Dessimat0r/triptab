<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
<title>An item-specific discount remains visible evidence and is not counted twice</title>
<defs><filter id="obscured"><feGaussianBlur stdDeviation="2.5"/></filter></defs>
<rect width="640" height="300" fill="#fff"/>
<g fill="#111" font-family="monospace" font-size="22">
<text x="25" y="35" font-size="16">SYNTHETIC TEST RECEIPT — NOT A SALE</text>
<text x="25" y="65" font-size="16">Corpus v1: item-discount</text>
<text x="25" y="115">Cookie                   2.00</text>
<text x="25" y="145">Cookie coupon           -0.50</text>
<text x="25" y="175">Sandwich                 5.00</text>
<text x="25" y="205">BEFORE DISCOUNT           7.00</text>
<text x="25" y="235">TOTAL EUR                6.50</text>
</g>

</svg>
