<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
<title>Subtotal exposes an obscured or missing purchased line</title>
<defs><filter id="obscured"><feGaussianBlur stdDeviation="2.5"/></filter></defs>
<rect width="640" height="300" fill="#fff"/>
<g fill="#111" font-family="monospace" font-size="22">
<text x="25" y="35" font-size="16">SYNTHETIC TEST RECEIPT — NOT A SALE</text>
<text x="25" y="65" font-size="16">Corpus v1: missing-line-subtotal</text>
<text x="25" y="115">Bread                    5.00</text>
<text x="25" y="145">Milk                     2.00</text>
<text x="25" y="175">[line covered by fold]</text>
<text x="25" y="205">SUBTOTAL EUR            12.00</text>
<text x="25" y="235">TOTAL EUR               12.00</text>
</g>

</svg>
