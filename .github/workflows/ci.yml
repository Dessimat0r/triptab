name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RECEIPT_AI_OWNER_EMAIL: ci-owner@example.invalid

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Run regression tests
        run: npm test

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Check types
        run: npx --no-install tsc --noEmit
      - name: Lint
        run: npm run lint

  browser:
    runs-on: ubuntu-24.04
    # Playwright's image already holds every browser and OS library for the
    # locked Playwright version, so no packages come from the Ubuntu mirror,
    # whose speed varies per runner. Keep the tag equal to the locked
    # @playwright/test version; a mismatch fails with a missing executable.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      # Chromium needs more shared memory than Docker's 64 MB default.
      options: --ipc=host
    timeout-minutes: 15
    strategy:
      # A failing engine must not cancel the other engine's coverage.
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Build
        run: npm run build
      - name: Check production browser layouts
        # Retain the measured two-worker default for each complete engine suite.
        run: npm run test:layout -- --project=${{ matrix.browser }}
      - name: Upload failed browser traces
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-failure-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the existing required check name. A failed, cancelled or skipped
  # dependency (including either browser engine) must never produce a green gate.
  verify:
    needs: [regression, quality, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          REGRESSION_RESULT: ${{ needs.regression.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$REGRESSION_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$BROWSER_RESULT" = success
